name: Keep Supabase Active

on:
  schedule:
    - cron: '0 0 * * *'  # 每天自動執行一次
  workflow_dispatch:     # 允許在 Actions 頁面手動點擊觸發

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/daily_reports?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
